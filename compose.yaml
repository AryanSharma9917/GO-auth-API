services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: goapi-auth
      JWT_SECRET: local-development-secret-change-before-production
      JWT_ISSUER: go-auth-api
      JWT_AUDIENCE: go-auth-clients
      PASSWORD_BCRYPT_COST: 12
      REFRESH_TOKEN_TTL: 720h
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
