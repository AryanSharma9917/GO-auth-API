openapi: 3.1.0
info:
  title: Go Auth API
  version: 1.0.0
  description: Multi-tenant authentication, sessions, members, invitations, recovery, and audit events.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/organizations/register:
    post:
      summary: Register an organization and owner
      responses: {'201': {description: Registered}, '422': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/login:
    post:
      summary: Log in
      responses: {'200': {description: Authenticated}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      responses: {'200': {description: Rotated}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/logout:
    post: {summary: Revoke a refresh session, responses: {'204': {description: Logged out}}}
  /api/v1/auth/password/reset-request:
    post: {summary: Request reset instructions, responses: {'202': {description: Accepted}}}
  /api/v1/auth/password/reset-confirm:
    post: {summary: Reset a password, responses: {'204': {description: Reset}}}
  /api/v1/auth/password/change:
    post:
      summary: Change the authenticated password
      security: [{bearerAuth: []}]
      responses: {'204': {description: Changed}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/sessions:
    get: {summary: List sessions, security: [{bearerAuth: []}], responses: {'200': {description: Sessions}}}
  /api/v1/organizations/current:
    get: {summary: Get current organization, security: [{bearerAuth: []}], responses: {'200': {description: Organization}}}
    patch: {summary: Rename current organization, security: [{bearerAuth: []}], responses: {'200': {description: Updated}}}
  /api/v1/organizations/current/members:
    get: {summary: List members, security: [{bearerAuth: []}], responses: {'200': {description: Members}}}
  /api/v1/organizations/current/invitations:
    get: {summary: List invitations, security: [{bearerAuth: []}], responses: {'200': {description: Invitations}}}
    post: {summary: Invite a member, security: [{bearerAuth: []}], responses: {'201': {description: Created}}}
  /api/v1/organizations/current/audit-events:
    get:
      summary: List audit events
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: cursor, schema: {type: string}}
        - {in: query, name: action, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
      responses: {'200': {description: Events}, '403': {$ref: '#/components/responses/Error'}}
  /health/live:
    get: {summary: Liveness, responses: {'200': {description: Live}}}
  /health/ready:
    get: {summary: Readiness, responses: {'200': {description: Ready}, '503': {description: Unavailable}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Error:
      description: Stable JSON error envelope
